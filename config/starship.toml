# Starship port of Shuv's Powerlevel10k prompt. Keep the prompt compact
# and transparent: thin Powerline separators, important context on the
# left, transient/runtime context on the right.

palette = "p10k"
add_newline = false
command_timeout = 1000

format = "$os$directory$custom "
right_format = "$status$cmd_duration$jobs$direnv$python$kubernetes$terraform$aws$gcloud$username$hostname$time"

[palettes.p10k]
separator = "#5f7e97"
white = "#ffffff"
cyan = "#00afff"
gold = "#f3b042"
coral = "#ff5874"
green = "#c5e478"
amber = "#ffcb8b"
teal = "#00afaf"
purple = "#af87ff"
orange = "#ff8700"

[os]
disabled = false
style = "fg:white"
format = "[$symbol]($style)"

[os.symbols]
Macos = ""

[directory]
style = "fg:cyan bold"
format = "[  ](fg:separator)[ $path]($style)[$read_only]($read_only_style)"
home_symbol = "~"
read_only = " "
read_only_style = "fg:coral"
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"repos" = "re"
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# P10k's custom_jj segment: show the nearest bookmark (or change ID).
# In a Git-only repository, retain the old branch + jj-init reminder.
[custom.jj]
when = 'jj root >/dev/null 2>&1 || git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = '''
state=$(jj log -r @ -T 'if(bookmarks, bookmarks.map(|b| b.name()).join(", "), parents.first().bookmarks().map(|b| b.name()).join(", ")) ++ "|" ++ change_id.shortest(8) ++ "|" ++ if(conflict, "!", "")' --no-graph 2>/dev/null) || state=
if [ -n "$state" ]; then
  bookmark=${state%%|*}
  rest=${state#*|}
  change=${rest%%|*}
  conflict=${rest#*|}
  [ -n "$bookmark" ] || bookmark="@$change"
  printf 'jj %s%s' "$bookmark" "${conflict:+ $conflict}"
else
  branch=$(git symbolic-ref --quiet --short HEAD 2>/dev/null || git rev-parse --short HEAD 2>/dev/null) || exit 0
  printf 'git %s · jj-init' "$branch"
fi
'''
style = "fg:gold"
format = "[  ](fg:separator)[$output]($style)"

# P10k had prompt_char disabled. Starship therefore leaves the command
# line immediately after the left prompt with one space.
[character]
disabled = true

# Right prompt. Each optional module owns its trailing separator so a
# hidden module never leaves a separator floating at the left edge.
[status]
disabled = false
success_symbol = "✔"
symbol = "✘"
not_executable_symbol = "✘"
not_found_symbol = "✘"
sigint_symbol = "✘"
signal_symbol = "✘"
style = "fg:coral"
success_style = "fg:green"
format = "[$symbol]($style)[  ](fg:separator)"

[cmd_duration]
min_time = 3000
show_milliseconds = false
style = "fg:separator"
format = "[$duration]($style)[  ](fg:separator)"

[jobs]
symbol = "✦"
number_threshold = 1
symbol_threshold = 1
style = "fg:amber"
format = "[$symbol]($style)[  ](fg:separator)"

[direnv]
disabled = false
style = "fg:amber"
format = "[$symbol$loaded/$allowed]($style)[  ](fg:separator)"

# Match P10k's virtualenv segment: environment name without Python version.
[python]
symbol = " "
style = "fg:teal"
format = "[$symbol$virtualenv]($style)[  ](fg:separator)"
detect_extensions = []
detect_files = []
detect_folders = []

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "fg:purple"
format = "[$symbol$context]($style)[  ](fg:separator)"

[terraform]
symbol = "󱁢 "
style = "fg:teal"
format = "[$symbol$workspace]($style)[  ](fg:separator)"

[aws]
symbol = " "
style = "fg:orange"
format = "[$symbol$profile]($style)[  ](fg:separator)"

[gcloud]
symbol = "󱇶 "
style = "fg:teal"
format = "[$symbol$account(@$domain)(\\($project\\))]($style)[  ](fg:separator)"

[username]
show_always = true
style_user = "fg:gold bold"
style_root = "fg:gold bold"
format = "[$user]($style)"

[hostname]
ssh_only = false
trim_at = ""
style = "fg:gold bold"
format = "[@$hostname]($style)[  ](fg:separator)"

[time]
disabled = false
use_12hr = false
time_format = "%H:%M:%S"
style = "fg:separator"
format = "[$time ]($style)"
